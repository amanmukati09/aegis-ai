spring:
  application:
    name: aegisai-gateway
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/aegisai}
    username: ${POSTGRES_USER:aegisai}
    password: ${POSTGRES_PASSWORD:aegisai}
    hikari:
      # Defaults sized for a single gateway instance against Postgres's default
      # max_connections=100 (see infra/docker/docker-compose.yml POSTGRES_MAX_CONNECTIONS,
      # bumped to 200 there to give headroom). 20 in-flight DB connections comfortably
      # serves thousands of concurrent users because virtual threads mean requests only
      # hold a connection for the duration of the actual query, not the whole request —
      # short-lived dashboard/live-monitor reads cycle through the pool quickly. Raise
      # via env if running multiple gateway replicas (divide max_connections across them).
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:20000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  threads:
    virtual:
      enabled: true
# OAuth2 client registrations are built programmatically in OAuth2ClientConfig
# (only for providers whose keys are set), so blank keys never break startup.

server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      # Tomcat's acceptor/worker threads are the real HTTP concurrency ceiling — virtual
      # threads (enabled above) make request *handling* cheap, but a connection still
      # needs a Tomcat thread to be accepted in the first place. Default of 200 is fine
      # for light traffic; raised so a burst of polling dashboards (live monitor, streams
      # activity panel) from many simultaneous users doesn't queue at the socket layer.
      max: ${TOMCAT_THREADS_MAX:400}
      min-spare: ${TOMCAT_THREADS_MIN_SPARE:20}
    accept-count: ${TOMCAT_ACCEPT_COUNT:200}

app:
  allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:3000}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}

jwt:
  secret: ${JWT_SECRET:dev-secret-change-me-min-32-bytes-long!!}
  expiry-days: ${JWT_EXPIRY_DAYS:7}

bootstrap:
  admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@aegis.local}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    name: ${BOOTSTRAP_ADMIN_NAME:Platform Admin}

rate-limit:
  requests-per-minute: ${RATE_LIMIT_RPM:100}

ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:8001}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    ai.aegis: DEBUG
